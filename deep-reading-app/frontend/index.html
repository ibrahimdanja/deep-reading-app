<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12141f;
    --panel: #1b1e2c;
    --text: #eef0f5;
    --muted: #8a90a6;
    --amber: #e3a04f;
    --amber-dim: #e3a04f33;
    --sage: #7fb69e;
    --hairline: #ffffff14;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse 600px 400px at 50% -10%, #e3a05522, transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
  }
  main {
    width: 100%;
    max-width: 620px;
  }
  .lamp-mark {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 40px;
  }
  .lamp-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 12px 2px var(--amber-dim);
  }
  .lamp-mark span {
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    color: var(--muted);
  }

  .category-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 36px;
  }
  .category-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 0.78rem;
    font-weight: 500;
  }
  .category-btn:hover { color: var(--text); opacity: 1; }
  .category-btn.active {
    background: var(--amber-dim);
    color: var(--amber);
    border-color: var(--amber-dim);
  }
  .loading {
    color: var(--muted);
    font-size: 0.95rem;
    padding: 40px 0;
  }
  article.piece {
    display: none;
  }
  article.piece.visible { display: block; }

  .source-line {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 10px;
  }
  h1.title {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.6rem;
    line-height: 1.3;
    margin: 0 0 22px;
    max-width: 26ch;
  }
  p.summary {
    font-family: 'Source Serif 4', serif;
    font-size: 1.08rem;
    line-height: 1.75;
    color: #dcdfe8;
    margin: 0 0 36px;
    max-width: 62ch;
  }
  a.source-link {
    color: var(--amber);
    text-decoration: none;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--amber-dim);
  }
  a.source-link:hover { border-bottom-color: var(--amber); }

  button {
    font-family: 'Manrope', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    cursor: pointer;
    background: var(--amber);
    color: #1a1206;
    transition: opacity 0.15s ease;
  }
  button:hover { opacity: 0.88; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .reveal-row { margin: 30px 0 10px; }

  .margin-section {
    margin-top: 40px;
    padding-top: 30px;
    border-top: 1px solid var(--hairline);
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.5s ease, opacity 0.5s ease;
  }
  .margin-section.open {
    max-height: 2000px;
    opacity: 1;
  }
  .margin-label {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 22px;
  }
  .question-block { margin-bottom: 26px; }
  .question-text {
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    font-size: 1.02rem;
    color: var(--text);
    line-height: 1.5;
    margin: 0 0 10px;
  }
  textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 0.92rem;
    padding: 12px 14px;
    min-height: 64px;
    resize: vertical;
  }
  textarea:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 1px;
  }
  textarea::placeholder { color: var(--muted); }

  .save-row { margin-top: 8px; display: flex; align-items: center; gap: 14px; }
  .saved-msg {
    color: var(--sage);
    font-size: 0.85rem;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .saved-msg.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .margin-section, .saved-msg { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="lamp-mark"><div class="lamp-dot"></div><span>deep reading</span></div>

  <div class="category-row" id="categoryRow"></div>

  <p class="loading" id="loading">Finding something worth reading...</p>

  <article class="piece" id="piece">
    <div class="source-line" id="sourceLine"></div>
    <h1 class="title" id="pieceTitle"></h1>
    <p class="summary" id="pieceSummary"></p>
    <a class="source-link" id="pieceUrl" target="_blank" rel="noopener">Read the full source →</a>

    <div class="reveal-row">
      <button id="revealBtn">I've read it — show the questions</button>
    </div>

    <section class="margin-section" id="marginSection">
      <p class="margin-label">Sit with these before moving on.</p>
      <div id="questionsWrap"></div>
      <div class="save-row">
        <button id="saveBtn">Save my answers</button>
        <span class="saved-msg" id="savedMsg">Saved.</span>
      </div>
    </section>
  </article>
</main>

<script>
let currentPiece = null;
let currentCategory = 'science';

async function loadCategories() {
  const res = await fetch('/api/categories');
  const categories = await res.json();

  const row = document.getElementById('categoryRow');
  row.innerHTML = '';
  Object.entries(categories).forEach(([key, label]) => {
    const btn = document.createElement('button');
    btn.className = 'category-btn' + (key === currentCategory ? ' active' : '');
    btn.textContent = label;
    btn.addEventListener('click', () => {
      currentCategory = key;
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadPiece();
    });
    row.appendChild(btn);
  });
}

async function loadPiece() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('piece').classList.remove('visible');

  const res = await fetch(`/api/piece?category=${currentCategory}`);
  const data = await res.json();
  currentPiece = data;

  document.getElementById('sourceLine').textContent = data.source;
  document.getElementById('pieceTitle').textContent = data.title;
  document.getElementById('pieceSummary').textContent = data.summary;
  document.getElementById('pieceUrl').href = data.url;

  const wrap = document.getElementById('questionsWrap');
  wrap.innerHTML = '';
  data.questions.forEach((q, i) => {
    const block = document.createElement('div');
    block.className = 'question-block';
    block.innerHTML = `
      <p class="question-text">${q}</p>
      <textarea data-idx="${i}" placeholder="Write your answer..."></textarea>
    `;
    wrap.appendChild(block);
  });

  document.getElementById('marginSection').classList.remove('open');
  document.getElementById('savedMsg').classList.remove('show');

  document.getElementById('loading').style.display = 'none';
  document.getElementById('piece').classList.add('visible');
}

document.getElementById('revealBtn').addEventListener('click', () => {
  document.getElementById('marginSection').classList.add('open');
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const textareas = document.querySelectorAll('#questionsWrap textarea');
  const answers = Array.from(textareas).map(t => t.value);

  await fetch('/api/answer', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      title: currentPiece.title,
      summary: currentPiece.summary,
      url: currentPiece.url,
      source: currentPiece.source,
      questions: currentPiece.questions,
      answers,
    }),
  });

  const msg = document.getElementById('savedMsg');
  msg.classList.add('show');
  setTimeout(() => { loadPiece(); }, 1400);
});

loadCategories();
loadPiece();
</script>
</body>
</html>
